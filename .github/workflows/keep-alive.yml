name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity. This touches the database and
# auth service every two days so the family's accounts stay available. It reads nothing private:
# the request uses the public key, and row-level security refuses it, which still counts as activity.
on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database and auth
        env:
          URL: https://xmxqrasmtremdrdooyav.supabase.co
          KEY: sb_publishable_RkQNAX5UUtRb0ij6OAmeVA_Rb9vx7y2
        run: |
          rest=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $KEY" "$URL/rest/v1/contributors?select=user_id&limit=1")
          auth=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $KEY" "$URL/auth/v1/health")
          echo "database: $rest, auth: $auth"
          # 401 from the database is expected (it's private). Anything else 5xx or no answer means it's paused or down.
          if [ "$auth" != "200" ] || [ "${rest:0:1}" = "5" ] || [ "$rest" = "000" ]; then
            echo "::error::Supabase didn't answer normally. It may be paused: restore it from the Supabase dashboard."
            exit 1
          fi
